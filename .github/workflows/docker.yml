name: Build and Push PHP Docker Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'       # 只有 Dockerfile 变化时才触发 push 构建
  schedule:
    - cron: '0 4 * * *'    # 每天定时检查官方基础镜像是否有更新
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Base Image Digest and Dockerfile Hash
        id: get-hash
        run: |
          # 1. 提取 Dockerfile 中的 FROM 镜像名称 (如 php:8.5-apache)
          BASE_IMAGE=$(grep -i '^FROM' Dockerfile | awk '{print $2}' | head -n 1)
          echo "🔍 基础镜像: $BASE_IMAGE"
          
          # 2. 获取该镜像在官方仓库的最新 Digest 指纹
          # 使用 buildx imagetools 查询，无需拉取整个镜像，速度极快
          IMAGE_DIGEST=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "🔑 基础镜像最新指纹: $IMAGE_DIGEST"
          
          # 3. 计算 Dockerfile 自身的哈希
          DF_HASH=$(sha256sum Dockerfile | awk '{print $1}')
          echo "📄 Dockerfile 哈希: $DF_HASH"
          
          # 组合成一个最终的 Key
          echo "final_key=$DF_HASH-$IMAGE_DIGEST" >> $GITHUB_OUTPUT

      - name: Check Build Cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: /tmp/build-marker
          key: php-build-${{ steps.get-hash.outputs.final_key }}

      - name: Log in to GHCR
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.cache-check.outputs.cache-hit != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=schedule
            latest

      - name: Build and push multi-arch image
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mark Build as Success
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/build-marker
          echo "done" > /tmp/build-marker/success
